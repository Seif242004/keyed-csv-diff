[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyed-csv-diff"
version = "0.1.0"
description = "Diff two CSV files by key columns: added, removed and changed rows with per-field detail."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
csvkdiff = "keyed_csv_diff.cli:main"

[tool.setuptools]
packages = ["keyed_csv_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
